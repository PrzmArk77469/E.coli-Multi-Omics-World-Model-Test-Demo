[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoli-world"
version = "0.1.0"
description = "Minimal event-driven E. coli multi-omics world-model Demo"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ecoli-world-mvp = "ecoli_world.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
