<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>E. coli Agent Replay</title>
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/three.min.js"></script>
  <script src="demo_visualization_data.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06100f;
      --panel: rgba(10, 22, 21, 0.92);
      --panel-solid: #0b1817;
      --line: #29403c;
      --text: #eef7f5;
      --muted: #90aaa4;
      --cyan: #4dd6c8;
      --green: #7ee787;
      --amber: #ffb454;
      --red: #ff6b6b;
      --blue: #6cb6ff;
      --violet: #d29bff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .topbar {
      position: fixed;
      z-index: 4;
      top: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .identity,
    .stats {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .identity {
      padding: 12px 16px;
      min-width: 270px;
    }

    .identity h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }

    .identity p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(74px, 1fr));
      min-width: 420px;
      overflow: hidden;
    }

    .stat {
      padding: 10px 14px;
      border-left: 1px solid var(--line);
    }

    .stat:first-child { border-left: 0; }

    .stat strong {
      display: block;
      font-size: 18px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .inspector {
      position: fixed;
      z-index: 4;
      top: 100px;
      right: 18px;
      width: 310px;
      max-height: calc(100vh - 250px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .inspector h2 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--cyan);
      font-weight: 650;
    }

    .inspector-grid {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 7px 10px;
      font-size: 12px;
    }

    .inspector-grid dt { color: var(--muted); }
    .inspector-grid dd {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--text);
    }

    .condition-note {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .controls {
      position: fixed;
      z-index: 5;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(14px);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .icon-button,
    .text-button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #10211f;
      color: var(--text);
      cursor: pointer;
    }

    .icon-button {
      width: 36px;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }

    .text-button {
      padding: 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .icon-button:hover,
    .text-button:hover,
    .text-button.active {
      border-color: var(--cyan);
      color: var(--text);
      background: #15302d;
    }

    .icon-button svg,
    .text-button svg {
      width: 16px;
      height: 16px;
    }

    .timeline-wrap {
      min-width: 0;
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    #timeline {
      display: grid;
      grid-template-columns: repeat(80, minmax(1px, 1fr));
      align-items: end;
      height: 28px;
      gap: 2px;
      cursor: pointer;
    }

    .timeline-bar {
      position: relative;
      height: 100%;
      min-height: 2px;
      padding: 0;
      border: 0;
      border-radius: 2px 2px 0 0;
      background: #203632;
      overflow: hidden;
    }

    .timeline-bar span {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: block;
      background: var(--cyan);
      opacity: 0.65;
    }

    .timeline-bar.current {
      outline: 1px solid var(--text);
      outline-offset: 1px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      display: none;
      max-width: 280px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-solid);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34);
      font-size: 12px;
      pointer-events: none;
    }

    .loading {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      transition: opacity 240ms ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-inner {
      width: min(360px, calc(100vw - 40px));
    }

    .loading-title {
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 10px;
    }

    .progress {
      height: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: #1b302d;
    }

    .progress span {
      display: block;
      width: 36%;
      height: 100%;
      background: var(--cyan);
      animation: loading 1.1s linear infinite;
    }

    @keyframes loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(310%); }
    }

    .offline-note {
      display: none;
      margin-top: 10px;
      color: var(--amber);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .topbar { right: 10px; left: 10px; }
      .identity { min-width: 0; }
      .stats { min-width: 0; grid-template-columns: repeat(2, minmax(70px, 1fr)); }
      .inspector { display: none; }
      .controls {
        left: 10px;
        right: 10px;
        bottom: 10px;
        grid-template-columns: auto 1fr;
      }
      .legend { grid-column: 1 / -1; }
    }

    @media (max-width: 640px) {
      .identity p { display: none; }
      .stats { display: none; }
      .controls { grid-template-columns: 1fr; }
      .control-group:first-child { justify-content: center; }
      #timeline { gap: 1px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="三维 agent 仿真场景"></canvas>

  <header class="topbar">
    <section class="identity">
      <h1>E. coli Multi-Omics Agent Replay</h1>
      <p>2,000-agent event engine · observed/synthetic provenance retained</p>
    </section>
    <section class="stats" aria-label="仿真统计">
      <div class="stat"><strong id="stat-step">0</strong><span>Step</span></div>
      <div class="stat"><strong id="stat-active">0</strong><span>Active agents</span></div>
      <div class="stat"><strong id="stat-events">0</strong><span>Cumulative events</span></div>
      <div class="stat"><strong id="stat-complexes">0</strong><span>Complexes</span></div>
    </section>
  </header>

  <aside class="inspector">
    <h2 id="inspect-title">选择 agent 查看详情</h2>
    <dl class="inspector-grid" id="inspect-grid">
      <dt>提示</dt><dd>悬停或点击场景中的质点。</dd>
    </dl>
    <div class="condition-note" id="inspect-note">
      颜色只表达仿真角色，不表示真实空间坐标或分子数量。
    </div>
  </aside>

  <footer class="controls">
    <div class="control-group">
      <button class="icon-button" id="prev" title="上一步" aria-label="上一步"><i data-lucide="skip-back"></i></button>
      <button class="icon-button" id="play" title="播放或暂停" aria-label="播放或暂停"><i data-lucide="play"></i></button>
      <button class="icon-button" id="next" title="下一步" aria-label="下一步"><i data-lucide="skip-forward"></i></button>
      <button class="icon-button" id="reset" title="回到起点" aria-label="回到起点"><i data-lucide="rotate-ccw"></i></button>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-meta">
        <span id="timeline-label">Step 0 / 79</span>
        <span id="step-outcomes">NO_EFFECT 0 · MODIFY 0 · BIND 0</span>
      </div>
      <div id="timeline" aria-label="事件时间轴"></div>
    </div>

    <div class="legend">
      <label class="legend-item"><input id="show-no-effect" type="checkbox" checked><span class="dot" style="background:#78a99c"></span>无效果</label>
      <label class="legend-item"><input id="show-modify" type="checkbox" checked><span class="dot" style="background:#ffb454"></span>修改</label>
      <label class="legend-item"><input id="show-bind" type="checkbox" checked><span class="dot" style="background:#4dd6c8"></span>结合</label>
      <select id="color-mode" class="text-button" aria-label="着色方式">
        <option value="type">按类型</option>
        <option value="origin">按分子来源</option>
        <option value="condition">按条件</option>
      </select>
    </div>
  </footer>

  <div class="tooltip" id="tooltip"></div>

  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-title">正在加载三维仿真场景…</div>
      <div class="progress"><span></span></div>
      <div class="offline-note" id="offline-note">
        三维依赖未加载。将切换到二维分布概览。
      </div>
    </div>
  </div>

  <script>
    window.__ECOLI_DEMO_READY = false;
    window.__ECOLI_DEMO_FALLBACK = false;
    window.setTimeout(function () {
      if (!window.__ECOLI_DEMO_READY) {
        window.__ECOLI_DEMO_FALLBACK = true;
        var note = document.getElementById("offline-note");
        if (note) note.style.display = "block";
        document.getElementById("loading").classList.add("hidden");
        drawFallback();
      }
    }, 6000);

    function drawFallback() {
      if (!window.ECOLI_DEMO) return;
      var canvas = document.getElementById("scene");
      var ratio = window.devicePixelRatio || 1;
      canvas.width = innerWidth * ratio;
      canvas.height = innerHeight * ratio;
      var ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.fillStyle = "#06100f";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      var agents = window.ECOLI_DEMO.agents;
      var scale = Math.min(innerWidth / 2.4, innerHeight / 1.4);
      ctx.fillStyle = "#4dd6c8";
      agents.forEach(function (agent) {
        var x = innerWidth / 2 + agent.x * scale;
        var y = innerHeight / 2 - agent.y * scale;
        ctx.beginPath();
        ctx.arc(x, y, agent.t === "Metabolite" ? 1.2 : 2.1, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = "#90aaa4";
      ctx.font = "13px Segoe UI";
      ctx.fillText("二维回退视图", 24, 80);
    }
  </script>

  <script>
    const DATA = window.ECOLI_DEMO;
    if (!DATA) {
      document.getElementById("loading-title").textContent = "缺少 demo_visualization_data.js";
      throw new Error("visualization data missing");
    }

    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06100f);
    scene.fog = new THREE.FogExp2(0x06100f, 0.14);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 30);
    camera.position.set(2.4, 1.55, 1.95);

    const target = new THREE.Vector3(0, 0, 0);
    let azimuth = 0.88;
    let polar = 1.05;
    let distance = 3.15;
    let dragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    function updateCamera() {
      polar = Math.max(0.22, Math.min(Math.PI - 0.22, polar));
      distance = Math.max(0.85, Math.min(6, distance));
      camera.position.set(
        target.x + distance * Math.sin(polar) * Math.cos(azimuth),
        target.y + distance * Math.cos(polar),
        target.z + distance * Math.sin(polar) * Math.sin(azimuth)
      );
      camera.lookAt(target);
    }
    updateCamera();

    scene.add(new THREE.HemisphereLight(0xd9fff9, 0x0b1917, 1.55));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.7);
    keyLight.position.set(3, 4, 3);
    scene.add(keyLight);

    const radius = DATA.config.cell_radius_um;
    const length = DATA.config.cell_length_um - 2 * radius;
    const capsule = new THREE.Mesh(
      new THREE.CapsuleGeometry(radius, length, 12, 32),
      new THREE.MeshPhysicalMaterial({
        color: 0x78c9be,
        transparent: true,
        opacity: 0.075,
        roughness: 0.55,
        transmission: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    capsule.rotation.z = Math.PI / 2;
    scene.add(capsule);

    const capsuleWire = new THREE.Mesh(
      new THREE.CapsuleGeometry(radius, length, 8, 20),
      new THREE.MeshBasicMaterial({
        color: 0x5eb9ad,
        wireframe: true,
        transparent: true,
        opacity: 0.09
      })
    );
    capsuleWire.rotation.z = Math.PI / 2;
    scene.add(capsuleWire);

    const typeColors = {
      ProteinA: new THREE.Color("#ffb454"),
      ProteinB: new THREE.Color("#6cb6ff"),
      Kinase: new THREE.Color("#ff6b6b"),
      Target: new THREE.Color("#a7e26d"),
      Metabolite: new THREE.Color("#d29bff")
    };
    const originColors = [
      new THREE.Color("#7ee787"),
      new THREE.Color("#ffb454"),
      new THREE.Color("#6cb6ff")
    ];
    const outcomeColors = [
      new THREE.Color("#5f817a"),
      new THREE.Color("#ffb454"),
      new THREE.Color("#4dd6c8")
    ];

    function conditionColor(index) {
      if (index < 0) return new THREE.Color("#60736f");
      return new THREE.Color().setHSL((index * 0.618033988749895) % 1, 0.58, 0.66);
    }

    const agentGeometry = new THREE.SphereGeometry(1, 12, 8);
    const agentMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.65,
      metalness: 0.04,
      vertexColors: true
    });
    const agents = new THREE.InstancedMesh(agentGeometry, agentMaterial, DATA.agents.length);
    agents.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(agents);

    const dummy = new THREE.Object3D();
    const baseColors = [];

    function colorForAgent(agent) {
      const mode = document.getElementById("color-mode").value;
      if (mode === "origin") return originColors[agent.o] || originColors[2];
      if (mode === "condition") return conditionColor(agent.c);
      return typeColors[agent.t] || new THREE.Color("#ffffff");
    }

    function refreshColors() {
      DATA.agents.forEach((agent, index) => {
        baseColors[index] = colorForAgent(agent);
        agents.setColorAt(index, baseColors[index]);
      });
      agents.instanceColor.needsUpdate = true;
    }

    const eventsByStep = Array.from({ length: DATA.config.steps }, () => []);
    DATA.events.forEach(event => eventsByStep[event.s].push(event));

    const cumulativeByStep = [];
    const currentByStep = [];
    let runningEvents = 0;
    for (let step = 0; step < DATA.config.steps; step += 1) {
      const counts = [0, 0, 0];
      eventsByStep[step].forEach(event => { counts[event.o] += 1; });
      currentByStep.push(counts);
      runningEvents += eventsByStep[step].length;
      cumulativeByStep.push(runningEvents);
    }

    const timeline = document.getElementById("timeline");
    const maxStepEvents = Math.max(1, ...eventsByStep.map(items => items.length));
    for (let step = 0; step < DATA.config.steps; step += 1) {
      const bar = document.createElement("button");
      bar.className = "timeline-bar";
      bar.title = `Step ${step}: ${eventsByStep[step].length} events`;
      bar.dataset.step = String(step);
      bar.style.height = `${Math.max(6, 100 * eventsByStep[step].length / maxStepEvents)}%`;
      const bind = document.createElement("span");
      bind.style.height = `${100 * currentByStep[step][2] / Math.max(1, eventsByStep[step].length)}%`;
      bar.appendChild(bind);
      timeline.appendChild(bar);
    }

    const lineMaterial = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.55,
      depthWrite: false
    });
    const lineGeometry = new THREE.BufferGeometry();
    const eventLines = new THREE.LineSegments(lineGeometry, lineMaterial);
    eventLines.frustumCulled = false;
    scene.add(eventLines);

    const complexGeometry = new THREE.SphereGeometry(1, 12, 8);
    const complexMaterial = new THREE.MeshStandardMaterial({
      color: 0x4dd6c8,
      emissive: 0x0b5b54,
      emissiveIntensity: 1.3,
      roughness: 0.3
    });
    const complexMesh = new THREE.InstancedMesh(
      complexGeometry,
      complexMaterial,
      Math.max(1, DATA.complexes.length)
    );
    complexMesh.count = 0;
    scene.add(complexMesh);

    let currentStep = 0;
    let playing = false;
    let lastFrame = performance.now();
    let accumulator = 0;
    let selectedAgent = null;
    const stepDuration = 280;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(2, 2);

    function outcomeEnabled(code) {
      if (code === 0) return document.getElementById("show-no-effect").checked;
      if (code === 1) return document.getElementById("show-modify").checked;
      return document.getElementById("show-bind").checked;
    }

    function setAgentInstances(step) {
      const active = new Array(DATA.agents.length).fill(true);
      DATA.agents.forEach(agent => { agent.currentState = agent.initial_state; });
      DATA.events.forEach(event => {
        if (event.s > step) return;
        DATA.agents[event.a].currentState = event.a_state;
        DATA.agents[event.b].currentState = event.b_state;
        if (event.o === 2) {
          active[event.a] = false;
          active[event.b] = false;
        }
      });

      let activeCount = 0;
      DATA.agents.forEach((agent, index) => {
        dummy.position.set(agent.x, agent.y, agent.z);
        agent.activeNow = active[index];
        const scale = active[index] ? agent.r : 0;
        dummy.scale.setScalar(scale);
        dummy.updateMatrix();
        agents.setMatrixAt(index, dummy.matrix);
        const color = baseColors[index].clone();
        if (!active[index]) color.multiplyScalar(0.34);
        agents.setColorAt(index, color);
        if (active[index]) activeCount += 1;
      });
      agents.instanceMatrix.needsUpdate = true;
      agents.instanceColor.needsUpdate = true;
      return activeCount;
    }

    function setEventLines(step) {
      const positions = [];
      const colors = [];
      const first = Math.max(0, step - 7);
      for (let eventStep = first; eventStep <= step; eventStep += 1) {
        eventsByStep[eventStep].forEach(event => {
          if (!outcomeEnabled(event.o)) return;
          const a = DATA.agents[event.a];
          const b = DATA.agents[event.b];
          positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
          const color = outcomeColors[event.o];
          const fade = eventStep === step ? 1 : 0.32;
          for (let index = 0; index < 2; index += 1) {
            colors.push(color.r * fade, color.g * fade, color.b * fade);
          }
        });
      }
      lineGeometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      lineGeometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      lineGeometry.computeBoundingSphere();
    }

    function setComplexes(step) {
      const visible = DATA.complexes.filter(item => item.step <= step);
      complexMesh.count = visible.length;
      visible.forEach((item, index) => {
        dummy.position.set(item.x, item.y, item.z);
        dummy.scale.setScalar(item.r);
        dummy.updateMatrix();
        complexMesh.setMatrixAt(index, dummy.matrix);
      });
      complexMesh.instanceMatrix.needsUpdate = true;
      return visible.length;
    }

    function updateInspector(agent) {
      const grid = document.getElementById("inspect-grid");
      const title = document.getElementById("inspect-title");
      if (!agent) {
        title.textContent = "选择 agent 查看详情";
        grid.innerHTML = "<dt>提示</dt><dd>悬停或点击场景中的质点。</dd>";
        return;
      }
      const condition = agent.c >= 0 ? DATA.conditions[agent.c] : null;
      const origin = ["OBSERVED", "MIXED", "SYNTHETIC"][agent.o] || "SYNTHETIC";
      title.textContent = `Agent ${agent.i}`;
      const rows = [
        ["类型", agent.t],
        ["状态", agent.activeNow ? agent.currentState : "complexed"],
        ["copy_weight", agent.w],
        ["分子来源", origin],
        ["条件来源", agent.co || "UNSPECIFIED"],
        ["球半径（μm）", agent.r],
        ["条件 ID", condition ? condition.id : "—"],
        ["样本 ID", condition ? condition.sample_id : "—"],
        ["菌株", condition ? condition.strain : "—"],
        ["培养基", condition ? condition.medium : "—"],
        ["基因型", condition ? condition.genotype : "—"],
        ["处理", condition ? condition.treatment : "—"],
        ["时间点", condition ? condition.timepoint : "—"],
        ["温度", condition ? condition.temperature || "未记录" : "—"],
        ["供氧", condition ? condition.oxygen || "未记录" : "—"]
      ];
      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
      grid.innerHTML = rows.map(row => {
        return `<dt>${escapeHtml(row[0])}</dt><dd>${escapeHtml(row[1])}</dd>`;
      }).join("");
    }

    function renderStep(step) {
      currentStep = Math.max(0, Math.min(DATA.config.steps - 1, step));
      const activeCount = setAgentInstances(currentStep);
      setEventLines(currentStep);
      const complexCount = setComplexes(currentStep);
      document.getElementById("stat-step").textContent = String(currentStep);
      document.getElementById("stat-active").textContent = activeCount.toLocaleString();
      document.getElementById("stat-events").textContent = cumulativeByStep[currentStep].toLocaleString();
      document.getElementById("stat-complexes").textContent = complexCount.toLocaleString();
      document.getElementById("timeline-label").textContent =
        `Step ${currentStep} / ${DATA.config.steps - 1}`;
      const counts = currentByStep[currentStep];
      document.getElementById("step-outcomes").textContent =
        `NO_EFFECT ${counts[0]} · MODIFY ${counts[1]} · BIND ${counts[2]}`;
      Array.from(timeline.children).forEach((bar, index) => {
        bar.classList.toggle("current", index === currentStep);
      });
      if (selectedAgent) updateInspector(selectedAgent);
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min(80, now - lastFrame);
      lastFrame = now;
      if (playing) {
        accumulator += delta;
        if (accumulator >= stepDuration) {
          accumulator = 0;
          renderStep(currentStep >= DATA.config.steps - 1 ? 0 : currentStep + 1);
        }
      }
      renderer.render(scene, camera);
    }

    function setPlaying(value) {
      playing = value;
      const button = document.getElementById("play");
      button.innerHTML = playing
        ? '<i data-lucide="pause"></i>'
        : '<i data-lucide="play"></i>';
      lucide.createIcons();
    }

    document.getElementById("play").addEventListener("click", () => setPlaying(!playing));
    document.getElementById("prev").addEventListener("click", () => renderStep(currentStep - 1));
    document.getElementById("next").addEventListener("click", () => renderStep(currentStep + 1));
    document.getElementById("reset").addEventListener("click", () => {
      setPlaying(false);
      renderStep(0);
    });
    document.getElementById("color-mode").addEventListener("change", () => {
      refreshColors();
      renderStep(currentStep);
    });
    ["show-no-effect", "show-modify", "show-bind"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => setEventLines(currentStep));
    });
    timeline.addEventListener("click", event => {
      const bar = event.target.closest(".timeline-bar");
      if (bar) renderStep(Number(bar.dataset.step));
    });

    canvas.addEventListener("pointermove", event => {
      if (dragging) {
        const deltaX = event.clientX - lastPointerX;
        const deltaY = event.clientY - lastPointerY;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        azimuth -= deltaX * 0.005;
        polar += deltaY * 0.005;
        updateCamera();
      }
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const intersections = raycaster.intersectObject(agents);
      const tooltip = document.getElementById("tooltip");
      if (intersections.length) {
        const agent = DATA.agents[intersections[0].instanceId];
        selectedAgent = agent;
        tooltip.style.display = "block";
        tooltip.style.left = `${Math.min(innerWidth - 290, event.clientX + 14)}px`;
        tooltip.style.top = `${Math.min(innerHeight - 110, event.clientY + 14)}px`;
        tooltip.textContent = `Agent ${agent.i} · ${agent.t} · ${["OBSERVED", "MIXED", "SYNTHETIC"][agent.o]}`;
      } else {
        tooltip.style.display = "none";
      }
    });
    canvas.addEventListener("pointerleave", () => {
      document.getElementById("tooltip").style.display = "none";
    });
    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointerup", event => {
      dragging = false;
      canvas.releasePointerCapture(event.pointerId);
    });
    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      distance *= Math.exp(event.deltaY * 0.001);
      updateCamera();
    }, { passive: false });
    canvas.addEventListener("click", () => updateInspector(selectedAgent));

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    refreshColors();
    renderStep(0);
    setPlaying(true);
    requestAnimationFrame(animate);
    lucide.createIcons();
    window.__ECOLI_DEMO_READY = true;
    document.getElementById("loading").classList.add("hidden");
  </script>
</body>
</html>
